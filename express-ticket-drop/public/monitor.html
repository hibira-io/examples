<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Drop monitor</title>
<style>
:root{--bg:#0f1117;--card:#181b24;--line:#2a2f3c;--ink:#f3f4f8;--mute:#9aa1b2;--bad:#ff5d5d;--ok:#3ddc97;--warn:#ffc35a;--accent:#8b85ff}
*{box-sizing:border-box;margin:0}
html{font-size:clamp(14px,1.5vw,28px)}
body{font:1rem/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);padding:1.6rem;min-height:100vh}
.top{display:flex;align-items:center;gap:14px;margin-bottom:1.2rem}
.top h1{font-size:1.6rem}
.badge{padding:6px 12px;border-radius:999px;font-weight:700;font-size:.85rem;background:#2a2f3c;color:var(--mute)}
.badge.after{background:rgba(61,220,151,.14);color:var(--ok)}
.badge.before{background:rgba(255,93,93,.14);color:var(--bad)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(9rem,1fr));gap:.9rem}
.tile{background:var(--card);border:1px solid var(--line);border-radius:1rem;padding:1rem 1.1rem}
.tile .k{color:var(--mute);font-weight:700;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase}
.tile .v{font-size:2.9rem;font-weight:800;font-variant-numeric:tabular-nums;margin-top:6px}
.tile .s{color:var(--mute);font-size:.8rem}
.bad{color:var(--bad)}.ok{color:var(--ok)}.warn{color:var(--warn)}
#banner{margin:1rem 0 0;padding:.8rem 1.1rem;border-radius:.9rem;font-size:1.5rem;font-weight:800;display:none}
#banner.bad{display:block;background:rgba(255,93,93,.12);border:1px solid rgba(255,93,93,.4)}
#banner.ok{display:block;background:rgba(61,220,151,.1);border:1px solid rgba(61,220,151,.35)}
.bar{height:1rem;border-radius:8px;background:#232733;overflow:hidden;display:flex;margin-top:12px}
.bar i{display:block;height:100%}
.chart{margin-top:1rem}
canvas{width:100%;height:9rem;display:block}
#queue{display:none}
</style></head><body>
<div class="top"><h1>Winter tour presale</h1><span class="badge" id="mode">…</span></div>
<div class="grid">
  <div class="tile"><div class="k">Seats sold</div><div class="v" id="sold">0</div><div class="s" id="of"></div></div>
  <div class="tile"><div class="k">Seats left</div><div class="v" id="left">0</div><div class="s">in the database</div></div>
  <div class="tile"><div class="k">Failed checkouts</div><div class="v" id="err">0</div><div class="s">timeouts, 503</div></div>
  <div class="tile"><div class="k">Checkouts / s</div><div class="v" id="rps">0</div><div class="s" id="pool"></div></div>
  <div class="tile" id="queue"><div class="k">In the waiting room</div><div class="v warn" id="wait">0</div><div class="s" id="adm"></div></div>
</div>
<div id="banner"></div>
<div class="tile chart"><div class="k">Seats sold vs. seats on sale</div><div class="bar"><i id="b1" style="background:var(--accent)"></i><i id="b2" style="background:var(--bad)"></i></div>
<div class="k" style="margin-top:16px">Checkouts per second</div><canvas id="c" width="1200" height="300"></canvas></div>
<script>
const $ = (id) => document.getElementById(id), n = (x) => x.toLocaleString('en-US');
const hist = [];
let lastWait = 0; // the line's status is cached for 2 s, so ask no more often
async function tick() {
  let s; try { s = await (await fetch('/api/stats')).json(); } catch { return; }
  $('mode').textContent = s.mode === 'after' ? 'With Hibira waiting room' : 'No waiting room';
  $('mode').className = 'badge ' + s.mode;
  $('sold').textContent = n(s.sold); $('of').textContent = 'of ' + n(s.seats) + ' on sale';
  $('sold').className = 'v' + (s.oversold ? ' bad' : s.sold === s.seats ? ' ok' : '');
  $('left').textContent = n(s.remaining); $('left').className = 'v' + (s.remaining < 0 ? ' bad' : '');
  $('err').textContent = n(s.errors); $('err').className = 'v' + (s.errors ? ' bad' : '');
  $('rps').textContent = n(s.perSecond); $('pool').textContent = s.waiting ? n(s.waiting) + ' waiting for a DB connection' : 'database OK';
  const tot = Math.max(s.seats, s.sold);
  $('b1').style.width = (Math.min(s.sold, s.seats) / tot * 100) + '%'; $('b2').style.width = (s.oversold / tot * 100) + '%';
  const b = $('banner');
  if (s.oversold) { b.className = 'bad'; b.textContent = 'Oversold by ' + n(s.oversold) + ' seats'; }
  else if (s.sold && s.sold === s.seats) { b.className = 'ok'; b.textContent = 'Sold out: exactly ' + n(s.seats) + ' seats, none oversold'; }
  else b.className = '';
  if (s.waitStatus && Date.now() - lastWait > 2000) {
    lastWait = Date.now();
    try {
      const w = await (await fetch(s.waitStatus, { cache: 'no-store' })).json();
      $('queue').style.display = 'block';
      if (w.state === 'closed') { $('wait').textContent = 'Closed'; $('adm').textContent = 'sold out · ' + n(w.admitted) + ' were let in'; }
      else { $('wait').textContent = n(w.waiting); $('adm').textContent = n(w.admitted) + ' let in · ' + n(w.admit_per_minute) + '/min'; }
    } catch {}
  }
  hist.push(s.perSecond); if (hist.length > 120) hist.shift(); draw();
}
function draw() {
  const c = $('c'), g = c.getContext('2d'), W = c.width, H = c.height, max = Math.max(50, ...hist);
  g.clearRect(0, 0, W, H); g.strokeStyle = '#2a2f3c'; g.lineWidth = 2;
  for (let i = 1; i < 4; i++) { g.beginPath(); g.moveTo(0, H * i / 4); g.lineTo(W, H * i / 4); g.stroke(); }
  g.beginPath(); hist.forEach((v, i) => { const x = W - (hist.length - 1 - i) * (W / 119), y = H - 8 - v / max * (H - 24); i ? g.lineTo(x, y) : g.moveTo(x, y); });
  g.strokeStyle = '#8b85ff'; g.lineWidth = 5; g.stroke();
}
tick(); setInterval(tick, 250);
</script></body></html>
