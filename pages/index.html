      const LANGS = Object.keys(STRINGS);

      function toLang(tag) {
        if (!tag) return null;
        const t = tag.toLowerCase();
        const exact = LANGS.find((l) => l.toLowerCase() === t);
        if (exact) return exact;
        if (t.startsWith('zh')) return /hans|cn|sg|my/.test(t) ? 'zh-CN' : 'zh-TW';
        return LANGS.find((l) => l === t.split('-')[0]) || null;
      }

      function detect() {
        const fromURL = toLang(new URLSearchParams(location.search).get('lang'));
        if (fromURL) return fromURL;
        try {
          const saved = toLang(localStorage.getItem('lang'));
          if (saved) return saved;
        } catch {}
        for (const tag of navigator.languages || [navigator.language]) {
          const lang = toLang(tag);
          if (lang) return lang;
        }
        return 'en';
      }

      // The demos share this origin, so they read the same remembered
      // language; ?lang= is passed on for the first visit as well.
      function apply(lang) {
        const s = STRINGS[lang];
        document.documentElement.lang = lang;
        document.title = s.title;
        for (const el of document.querySelectorAll('[data-t]')) el.textContent = s[el.dataset.t];
        for (const a of document.querySelectorAll('[data-demo]')) a.search = '?lang=' + lang;
        select.value = lang;
      }

      const select = document.getElementById('lang');
      for (const l of LANGS) select.add(new Option(STRINGS[l].name, l));
      select.addEventListener('change', () => {
        try {
          localStorage.setItem('lang', select.value);
        } catch {}
        apply(select.value);
      });
      apply(detect());
