    <style>
      :root { --bg: #faf9f7; --card: #fff; --text: #111110; --muted: #6f6d66; --border: #e7e5e0; --accent: #e5484d; --accent-ink: #fff; }
      @media (prefers-color-scheme: dark) {
        :root { --bg: #0f0f10; --card: #1b1b1e; --text: #f4f3f1; --muted: #9b9991; --border: #2b2b2f; --accent: #ff6369; --accent-ink: #1a0b0c; }
      }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.6 system-ui, -apple-system, 'Segoe UI', sans-serif; }
      a { color: var(--accent); }
      main { max-width: 880px; margin: 0 auto; padding: 32px 16px 48px; }
      nav { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
      nav a { text-decoration: none; font-weight: 600; }
      .brand { display: inline-flex; align-items: center; gap: 8px; color: var(--text); font-size: 1.05em; }
      .brand img { width: 24px; height: 24px; }
      .lang { position: relative; }
      .lang > button { display: inline-flex; align-items: center; gap: 6px; font: inherit; color: var(--text); background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 5px 10px; cursor: pointer; }
      .lang > button:hover, .lang.open > button { border-color: var(--accent); }
      .lang > button svg { color: var(--muted); transition: transform 0.2s; }
      .lang.open > button svg { transform: rotate(180deg); }
      .lang ul { position: absolute; right: 0; top: calc(100% + 6px); z-index: 5; min-width: 150px; margin: 0; padding: 6px; list-style: none; background: var(--card); border: 1px solid var(--border); border-radius: 10px; box-shadow: 0 12px 32px rgba(17, 17, 16, 0.14); display: none; }
      .lang.open ul { display: block; }
      .lang li { padding: 7px 10px; border-radius: 7px; cursor: pointer; }
      .lang li:hover, .lang li:focus { background: color-mix(in srgb, var(--accent) 10%, transparent); outline: none; }
      .lang li[aria-selected='true'] { color: var(--accent); font-weight: 600; }
      h1 { font-size: 1.8em; margin: 32px 0 8px; }
      .muted { color: var(--muted); }
      .grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 24px; margin-top: 24px; }
      .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; display: flex; flex-direction: column; gap: 8px; }
      .card h2 { margin: 0; font-size: 1.15em; }
      .preview { position: relative; display: block; margin: -20px -20px 6px; aspect-ratio: 966 / 700; overflow: hidden; border-radius: 11px 11px 0 0; border-bottom: 1px solid var(--border); background: var(--border); }
      .preview video { display: block; width: 100%; height: 100%; object-fit: cover; }
      .preview .tag { position: absolute; left: 10px; bottom: 10px; display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px; border-radius: 999px; background: rgba(20, 22, 31, 0.72); color: #fff; font-size: 0.78em; font-weight: 600; }
      .preview .tag::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: #3dd68c; }
      .card p { margin: 0; flex: 1; }
      .links { display: flex; gap: 16px; flex-wrap: wrap; }
      .button { background: var(--accent); color: var(--accent-ink); border-radius: 8px; padding: 6px 14px; text-decoration: none; font-weight: 600; }
      footer { margin-top: 40px; font-size: 0.9em; }
    </style>

      const LANGS = Object.keys(STRINGS);

      function toLang(tag) {
        if (!tag) return null;
        const t = tag.toLowerCase();
        const exact = LANGS.find((l) => l.toLowerCase() === t);
        if (exact) return exact;
        if (t.startsWith('zh')) return /hans|cn|sg|my/.test(t) ? 'zh-CN' : 'zh-TW';
        return LANGS.find((l) => l === t.split('-')[0]) || null;
      }

      function detect() {
        const fromURL = toLang(new URLSearchParams(location.search).get('lang'));
        if (fromURL) return fromURL;
        try {
          const saved = toLang(localStorage.getItem('lang'));
          if (saved) return saved;
        } catch {}
        for (const tag of navigator.languages || [navigator.language]) {
          const lang = toLang(tag);
          if (lang) return lang;
        }
        return 'en';
      }

      // The demos share this origin, so they read the same remembered
      // language; ?lang= is passed on for the first visit as well.
      function apply(lang) {
        const s = STRINGS[lang];
        document.documentElement.lang = lang;
        document.title = s.title;
        for (const el of document.querySelectorAll('[data-t]')) el.textContent = s[el.dataset.t];
        for (const a of document.querySelectorAll('[data-demo]')) a.search = '?lang=' + lang;
        menu.querySelector('button span').textContent = s.name;
        for (const li of list.children) li.setAttribute('aria-selected', String(li.dataset.lang === lang));
      }

      const menu = document.getElementById('lang');
      const list = menu.querySelector('ul');
      const toggle = menu.querySelector('button');
      function open(on) {
        menu.classList.toggle('open', on);
        toggle.setAttribute('aria-expanded', String(on));
        if (on) (list.querySelector('[aria-selected="true"]') || list.firstElementChild).focus();
      }
      function pick(lang) {
        try {
          localStorage.setItem('lang', lang);
        } catch {}
        apply(lang);
        open(false);
        toggle.focus();
      }
      for (const l of LANGS) {
        const li = document.createElement('li');
        li.role = 'option';
        li.tabIndex = -1;
        li.dataset.lang = l;
        li.textContent = STRINGS[l].name;
        li.addEventListener('click', () => pick(l));
        list.appendChild(li);
      }
      toggle.addEventListener('click', () => open(!menu.classList.contains('open')));
      list.addEventListener('keydown', (e) => {
        const items = [...list.children];
        const i = items.indexOf(document.activeElement);
        if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
          e.preventDefault();
          items[(i + (e.key === 'ArrowDown' ? 1 : items.length - 1)) % items.length].focus();
        } else if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          if (i >= 0) pick(items[i].dataset.lang);
        } else if (e.key === 'Escape') {
          open(false);
          toggle.focus();
        }
      });
      document.addEventListener('click', (e) => {
        if (!menu.contains(e.target)) open(false);
      });
      apply(detect());

      // The previews are short muted clips (pages/gallery, recorded with
      // scripts/gallery): each loads when its card scrolls into view and
      // pauses off screen. With reduced motion only the poster shows.
      const still = matchMedia('(prefers-reduced-motion: reduce)');
      const videos = document.querySelectorAll('.preview video');
      const seen = new IntersectionObserver(
        (entries) => {
          for (const { target: v, isIntersecting } of entries) {
            if (isIntersecting && !still.matches) {
              if (!v.src) v.src = v.dataset.src;
              v.play().catch(() => {});
            } else {
              v.pause();
            }
          }
        },
        { threshold: 0.3 },
      );
      for (const v of videos) seen.observe(v);
      still.addEventListener('change', () => {
        for (const v of videos) {
          seen.unobserve(v);
          if (still.matches) v.pause();
          seen.observe(v);
        }
      });
    </script>
