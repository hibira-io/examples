name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  open-webui-tool:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: open-webui-tool
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: pip install pydantic
      - run: python -m unittest -v

  nextjs-dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nextjs-dashboard
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  nextjs-ops-dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nextjs-ops-dashboard
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  nextjs-long-jobs:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nextjs-long-jobs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  nextjs-auction:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nextjs-auction
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  nextjs-invite-queue:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nextjs-invite-queue
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build

  nextjs-lobby:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nextjs-lobby
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  nextjs-handoff:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nextjs-handoff
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  phaser-lobby:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: phaser-lobby
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  godot-lobby:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: godot-lobby
    env:
      GODOT_VERSION: 4.7.2-stable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Godot
        run: |
          curl -fsSL -o godot.zip "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          curl -fsSL -o SHA512-SUMS.txt "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/SHA512-SUMS.txt"
          echo "$(grep " Godot_v${GODOT_VERSION}_linux.x86_64.zip" SHA512-SUMS.txt | cut -d' ' -f1)  godot.zip" | sha512sum -c -
          unzip -q godot.zip -d "$RUNNER_TEMP/godot"
          mv "$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}_linux.x86_64" "$RUNNER_TEMP/godot/godot"
          rm godot.zip SHA512-SUMS.txt
      - run: $RUNNER_TEMP/godot/godot --headless --import
      - run: $RUNNER_TEMP/godot/godot --headless --script res://tests/test_protocol.gd

  react-native-push:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: react-native-push
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck

  laravel-chat:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: laravel-chat
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: "8.4"
          coverage: none
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: composer install --no-interaction --no-progress
      - run: cp .env.example .env && php artisan key:generate
      - run: npm ci && npm run build
      - run: php artisan test

  laravel-ai-approvals:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: laravel-ai-approvals
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_USER: demo
          POSTGRES_PASSWORD: demo
          POSTGRES_DB: demo_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U demo -d demo_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: "8.4"
          extensions: pdo_pgsql, pcntl, posix, intl
          coverage: none
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: composer install --no-interaction --no-progress
      - run: cp .env.example .env && php artisan key:generate
      - run: npm ci && npm run build
      - run: npm test
      - run: vendor/bin/pint --test
      # Feature tests, then the multi-process PostgreSQL concurrency and worker-kill tests.
      - run: php artisan test

  # Browser E2E over a real Hibira test app. Runs only when the repository
  # has the HIBIRA_E2E_* secrets (an app whose Allowed origins include
  # http://127.0.0.1:8000); otherwise it says so and passes.
  laravel-ai-approvals-e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: laravel-ai-approvals
    env:
      HIBIRA_APP_ID: ${{ secrets.HIBIRA_E2E_APP_ID }}
      HIBIRA_APP_KEY: ${{ secrets.HIBIRA_E2E_APP_KEY }}
      HIBIRA_APP_SECRET: ${{ secrets.HIBIRA_E2E_APP_SECRET }}
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_USER: demo
          POSTGRES_PASSWORD: demo
          POSTGRES_DB: demo
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U demo -d demo"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check for a Hibira test app
        id: creds
        run: |
          if [ -z "$HIBIRA_APP_KEY" ]; then echo "No HIBIRA_E2E_* secrets: skipping the real-Hibira E2E."; echo "run=false" >> "$GITHUB_OUTPUT"; else echo "run=true" >> "$GITHUB_OUTPUT"; fi
      - if: steps.creds.outputs.run == 'true'
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: "8.4"
          extensions: pdo_pgsql, pcntl, posix, intl
          coverage: none
      - if: steps.creds.outputs.run == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - if: steps.creds.outputs.run == 'true'
        run: |
          composer install --no-interaction --no-progress
          cp .env.example .env && php artisan key:generate
          npm ci && npm run build
          npx playwright@1.56.1 install --with-deps chromium
          npm install --no-save playwright@1.56.1
          php artisan migrate --force && php artisan demo:reset
          APP_URL=http://127.0.0.1:8000 php artisan serve --host=127.0.0.1 --port=8000 > serve.log 2>&1 &
          php artisan queue:work --sleep=1 > worker.log 2>&1 &
          sleep 3
          BASE_URL=http://127.0.0.1:8000 node tests/e2e/approval-flow.mjs

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate
      - run: terraform test
