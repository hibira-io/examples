name: pages
# The hosted demos on GitHub Pages (https://demos.hibira.io/examples/):
# each Next.js example built as a static export (NEXT_PUBLIC_DEMO_API, see
# its next.config.ts) under its own path, phaser-lobby built with
# VITE_DEMO_API, plus the index in pages/. The
# server side runs on Hibira's demo backend, so this needs no secrets.
#
# Deploys from main (Settings → Pages → Source: GitHub Actions); on pull
# requests it only checks that the demos build.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_PUBLIC_DEMO_API: ${{ vars.DEMO_API_URL || 'https://demo-api.hibira.io' }}
  # nextjs-handoff: the demo account's plan allows 10 KB client events.
  NEXT_PUBLIC_RELAY_CHUNK_BYTES: 7000

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: build the demos
        run: |
          set -euo pipefail
          mkdir -p site
          cp -r pages/. site/
          for app in nextjs-lobby nextjs-dashboard nextjs-spaces nextjs-games nextjs-handoff nextjs-sql-approvals nextjs-auction; do
            (cd "$app" && npm ci --no-audit --no-fund && DEMO_BASE_PATH="/examples/$app" npm run build)
            cp -r "$app/out" "site/$app"
          done
          # The invite code queue lives at hibira.io/tools/invite-queue/, which
          # hibira.io serves from this build (hibira-io/examples-infra demo-api
          # tools-page.js), with Google Analytics on hibira.io's property.
          (cd nextjs-invite-queue && npm ci --no-audit --no-fund \
            && NEXT_PUBLIC_GA_ID=G-YSHF64WNZ6 DEMO_BASE_PATH=/tools/invite-queue npm run build \
            && mkdir -p ../site/tools && cp -r out ../site/tools/invite-queue)
          # Its earlier address here sends every page, query and hash on to
          # hibira.io (GitHub Pages has no 301: an instant refresh with the
          # canonical, which search engines take as a permanent move), and
          # its service worker removes itself from installed copies.
          for p in "" give/ get/ vendor/; do
            mkdir -p "site/invite-queue/$p"
            u="https://hibira.io/tools/invite-queue/$p"
            printf '<!doctype html><meta charset="utf-8"><title>Invite code queue</title><link rel="canonical" href="%s"><meta name="robots" content="noindex"><meta http-equiv="refresh" content="0; url=%s"><script>location.replace("%s"+location.search+location.hash)</script><a href="%s">%s</a>\n' "$u" "$u" "$u" "$u" "$u" > "site/invite-queue/${p}index.html"
          done
          printf 'self.addEventListener("install",()=>self.skipWaiting());self.addEventListener("activate",e=>e.waitUntil(self.registration.unregister().then(()=>self.clients.matchAll()).then(cs=>cs.forEach(c=>c.navigate(c.url)))));\n' > site/invite-queue/sw.js
          (cd phaser-lobby && npm ci --no-audit --no-fund && VITE_DEMO_API="$NEXT_PUBLIC_DEMO_API" DEMO_BASE_PATH=/examples/phaser-lobby npx vite build)
          cp -r phaser-lobby/dist site/phaser-lobby
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
