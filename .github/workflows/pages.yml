name: pages
# The hosted demos on GitHub Pages (https://demos.hibira.io/examples/):
# each Next.js example built as a static export (NEXT_PUBLIC_DEMO_API, see
# its next.config.ts) under its own path, phaser-lobby built with
# VITE_DEMO_API, plus the index in pages/. The
# server side runs on Hibira's demo backend, so this needs no secrets.
#
# Deploys from main (Settings → Pages → Source: GitHub Actions); on pull
# requests it only checks that the demos build.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_PUBLIC_DEMO_API: ${{ vars.DEMO_API_URL || 'https://demo-api.hibira.io' }}
  # nextjs-handoff: the demo account's plan allows 10 KB client events.
  NEXT_PUBLIC_RELAY_CHUNK_BYTES: 7000

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: build the demos
        run: |
          set -euo pipefail
          mkdir -p site
          cp -r pages/. site/
          for app in nextjs-lobby nextjs-dashboard nextjs-spaces nextjs-games nextjs-handoff nextjs-sql-approvals nextjs-auction; do
            (cd "$app" && npm ci --no-audit --no-fund && DEMO_BASE_PATH="/examples/$app" npx next build)
            cp -r "$app/out" "site/$app"
          done
          # The invite code queue is shared as a link, so it gets a short path.
          (cd nextjs-invite-queue && npm ci --no-audit --no-fund && DEMO_BASE_PATH=/examples/invite-queue npx next build)
          cp -r nextjs-invite-queue/out site/invite-queue
          (cd phaser-lobby && npm ci --no-audit --no-fund && VITE_DEMO_API="$NEXT_PUBLIC_DEMO_API" DEMO_BASE_PATH=/examples/phaser-lobby npx vite build)
          cp -r phaser-lobby/dist site/phaser-lobby
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
