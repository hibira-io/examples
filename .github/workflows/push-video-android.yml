# Temporary: records web-push-orders on an Android emulator for the tutorial video. Removed before merge.
name: push-video-android
on:
  push:
    branches: [claude/project-thread-9j2f3a]
    paths: [.github/workflows/push-video-android.yml, .github/rec/**]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Start demo server
        working-directory: web-push-orders
        run: |
          npm ci
          printf 'HIBIRA_PUSH_INSTANCE_ID=%s\nHIBIRA_PUSH_SECRET_KEY=none\nHIBIRA_PUSH_ENDPOINT=ws.hibira.io\nPORT=3000\n' "$(cat ../.github/rec/instance)" > .env
          nohup node --env-file=.env server.mjs > server.log 2>&1 &
          sleep 2 && curl -s localhost:3000/api/config
      - name: Record
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -skin 1080x2400
          script: bash .github/rec/android.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-rec
          path: rec-out/
